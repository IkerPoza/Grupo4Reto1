<!--HEADER-->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AERGIBIDE SL</title>

    <link rel="stylesheet" href="estilos/InicioSesion-estilo.css">
</head>

<body>


    <header class="cabecera">
        <div class="logo">
            <img src="imagenes/Logo.png" alt="Logo de AERGIBIDE SL">
            <h1>AERGIBIDE SL</h1>
        </div>

        <div class="perfil">
            <img src="imagenes/Perfil.png" alt="Icono de perfil">
        </div>
    </header>





    <!--INICIO SESION-->

<main class="login-contenedor">
<div class="login-division">
    <h2 class="login-titulo">Inicio Sesion</h2>

    <form class="inicioSesion-form">
        <div class="input-email">
            <label for="email">Gmail:</label>
            <input type="email" placeholder="Escribe tu gmail" required><br>
        </div>
        
        <div class="input-password">
            <label for="password">Contrase&ntilde;a:</label>
            <input type="password" placeholder="Escribe tu contraseña" required>
        </div>
        
        <div class="botones">
            <input type="submit" value="Iniciar Sesion">
            <button type="submit" class="btn-registro">Registrarse</button>
        </div>
    </form>
</div>
</main>

    <!--FOOTER-->
</body>
</html>
